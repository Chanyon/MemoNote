[package]
name = "whiteboard-notes"
version = "0.1.0"
edition = "2024"
description = "An infinite whiteboard note taking app built with GPUI Kit"

[dependencies]
anyhow = "1"
arboard = "3.6"
base64 = "0.22"
dirs = "6"
gpui-kit = "0.7.3"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
